; Mounted into the Sail container by compose.yaml.
; Sail serves the app with `php artisan serve` (PHP CLI), where OPcache is off by default,
; so every request re-read and re-compiled hundreds of PHP files. That is very slow when
; the project folder is on a Windows drive (/mnt/c/...).
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
; Still pick up code edits: re-check changed files at most every 2 seconds.
opcache.validate_timestamps=1
opcache.revalidate_freq=2
